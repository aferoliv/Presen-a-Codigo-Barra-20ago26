<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Presenças - QUI 112</title>
    <!-- Bootstrap CSS for styling -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />    
  </head>
  <body class="p-2">
    <div class="container-fluid">
      <!-- Header section -->
      <header class="text-bg-primary text-center py-1 mb-2">
        <h4 class="mb-0">Coleta de Frequência - Estudos Dirigidos</h4>
      </header>
      <!-- Instructions and Connection sections -->
      <div class="row g-2 mb-2 align-items-center">
        <div class="col-md-3">
          <label for="matricula" class="form-label mb-0">Matrícula</label>
          <input
            type="number"
            id="matricula"
            class="form-control"
            value=""
          />
          <div id="espaco-display" class="alert alert-info mt-2">Ocupação: 0</div>
        </div>
        <div class="col-md-6">
          <div id="situacao-display" class="alert alert-info">Aguardando Início</div>
        </div>
        <div class="col-md-2">
          <button
            type="button"
            id="start-data-button"
            class="btn btn-danger full-width-button"
            enabled
          >
            Começar Leitura
          </button>
        </div>
      </div>
      <!-- Características do Aluno -->
      <div class="row g-2 mb-2 align-items-center">
        <div class="col-md-3">
          <div id="nome-display" class="alert alert-info">Nome Aluno: 0</div>
          <div id="entrada-display" class="alert alert-info">Hora Entrada: 0</div>
        </div>
        <div class="col-md-2">
          <div id="max-points-display" class="alert alert-info">Matrícula: 0</div>
          <div id="permanencia-display" class="alert alert-info">Permanencia: 0</div>
        </div>
       
      </div>
      <!-- Tabela e botão de salvar -->
      <div class="row g-2 mb-2 align-items-center">
        <div class="col">
          <button
            type="button"
            id="savelistButton"
            class="btn btn-info full-width-button"
            enabled>
            Salvar Lista
          </button>
        </div>
      </div>
      <div class="row">
        <div class="col-12">
          <div class="scrollable-table">
            <table class="table mt-2">
              <thead>
                <tr>
                  <th colspan="5" class="text-center">Informações do Aluno</th>
                </tr>
                <tr>
                  <th>Matrícula</th>
                  <th>Permanência /min </th>
                  <th>Hora Entrada</th>
                  <th>Nome</th>
                  <th>n°</th>
                </tr>
              </thead>
              <tbody id="real-time-table-body">
                <!-- Data will be populated dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
      <div class="col-md-2">
          <label for="remove-line" class="form-label mb-0">n° linha</label>
          <input
            type="number"
            id="remove-line" 
            class="form-control"
            value=""
          />
    </div>
    <!-- Footer section -->
      <footer class="text-bg-dark text-center py-1 mt-2">
        <h6 class="mb-0">Footer</h6>
        <p class="mb-0">Sistema de Presenças - QUI 112 Universidade Federal de Viçosa</p>
      </footer>
    <!-- External JavaScript libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
      integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
      crossorigin="anonymous"
    ></script>
    <!-- Application-specific JavaScript -->
    <script src="app.js"></script>
  </body>
</html>
